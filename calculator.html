<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKTU SGPA Calculator | AKTU Helper</title>
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    .calc-container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .row-header {
      display: flex;
      gap: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.8rem;
      padding: 0 0.5rem;
      font-size: 0.9rem;
    }

    .row-header .col-name { flex: 2; }
    .row-header .col-credit { flex: 1; }
    .row-header .col-grade { flex: 1; }
    .row-header .col-action { width: 36px; text-align: center; }

    .subject-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      margin-bottom: 0.8rem;
      background: #0b1120;
      padding: 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .subject-row input, .subject-row select {
      padding: 0.65rem;
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .subject-row input { flex: 2; width: 100%; }
    .subject-row select { flex: 1; width: 100%; }

    .subject-row input:focus, .subject-row select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .remove-btn {
      background: #ef4444;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .remove-btn:hover {
      background: #dc2626;
    }

    .calc-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .add-btn {
      flex: 1;
      padding: 0.8rem;
      background: #334155;
      color: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .add-btn:hover {
      background: #475569;
    }

    .calc-btn {
      flex: 2;
      padding: 0.8rem;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .calc-btn:hover {
      background: var(--accent-hover);
    }

    .result-box {
      margin-top: 2rem;
      padding: 1.5rem;
      border-radius: 12px;
      background: #0b1120;
      border: 1px solid var(--border-color);
      text-align: center;
      display: none;
    }

    .result-box h3 {
      font-size: 2rem;
      color: #10b981;
      margin-bottom: 0.3rem;
    }

    .result-box p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .subject-row {
        flex-direction: column;
        align-items: stretch;
      }
      .row-header {
        display: none;
      }
      .remove-btn {
        width: 100%;
        height: 36px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AKTU Helper</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="notes.html">Notes & PYQs</a>
      <a href="contribute.html">Upload Notes</a>
      <a href="calculator.html" class="active">SGPA Calculator</a>
      <a href="https://oneview.aktu.ac.in/oneview/oneview.aspx" target="_blank" rel="noopener noreferrer" class="btn-link">AKTU OneView</a>
    </nav>
  </header>

  <main class="hero">
    <h1>AKTU SGPA Calculator</h1>
    <p>Select grades and credits according to AKTU evaluation scheme to compute your semester SGPA.</p>

    <div class="calc-container">
      <div class="row-header">
        <span class="col-name">Subject Name</span>
        <span class="col-credit">Credits</span>
        <span class="col-grade">Grade Obtained</span>
        <span class="col-action"></span>
      </div>

      <div id="subjectRows">
        <!-- Rows will be injected here by JavaScript -->
      </div>

      <div class="calc-actions">
        <button class="add-btn" onclick="addSubjectRow()">+ Add Subject</button>
        <button class="calc-btn" onclick="calculateSGPA()">Calculate SGPA</button>
      </div>

      <div class="result-box" id="resultBox">
        <h3 id="sgpaScore">0.00</h3>
        <p id="sgpaDetails"></p>
      </div>
    </div>
  </main>

  <script>
    // Default start with 5 rows (standard theory + practicals)
    let defaultSubjects = [
      { name: "Subject 1 (Theory)", credit: 4 },
      { name: "Subject 2 (Theory)", credit: 4 },
      { name: "Subject 3 (Theory)", credit: 3 },
      { name: "Subject 4 / Lab", credit: 2 },
      { name: "Lab / Practical", credit: 1 }
    ];

    const container = document.getElementById('subjectRows');

    function createRow(name = '', credit = 4) {
      const row = document.createElement('div');
      row.className = 'subject-row';
      row.innerHTML = `
        <input type="text" placeholder="Subject Name (Optional)" value="${name}">
        <select class="credits">
          <option value="5" ${credit === 5 ? 'selected' : ''}>5 Credits</option>
          <option value="4" ${credit === 4 ? 'selected' : ''}>4 Credits</option>
          <option value="3" ${credit === 3 ? 'selected' : ''}>3 Credits</option>
          <option value="2" ${credit === 2 ? 'selected' : ''}>2 Credits</option>
          <option value="1" ${credit === 1 ? 'selected' : ''}>1 Credit</option>
        </select>
        <select class="grade">
          <option value="10">O / S (10)</option>
          <option value="9">A+ (9)</option>
          <option value="8">A (8)</option>
          <option value="7">B+ (7)</option>
          <option value="6">B (6)</option>
          <option value="5">C (5)</option>
          <option value="0">F (0)</option>
        </select>
        <button class="remove-btn" onclick="removeRow(this)" title="Remove Subject">&times;</button>
      `;
      container.appendChild(row);
    }

    function initRows() {
      container.innerHTML = '';
      defaultSubjects.forEach(s => createRow(s.name, s.credit));
    }

    function addSubjectRow() {
      createRow();
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('.subject-row');
      if (rows.length > 1) {
        btn.closest('.subject-row').remove();
      } else {
        alert("At least one subject row is required!");
      }
    }

    function calculateSGPA() {
      const credits = document.querySelectorAll('.credits');
      const grades = document.querySelectorAll('.grade');

      let totalPoints = 0;
      let totalCredits = 0;

      for (let i = 0; i < credits.length; i++) {
        let creditVal = parseFloat(credits[i].value);
        let gradeVal = parseFloat(grades[i].value);

        totalPoints += creditVal * gradeVal;
        totalCredits += creditVal;
      }

      if (totalCredits === 0) {
        alert("Please set credits for your subjects.");
        return;
      }

      let sgpa = (totalPoints / totalCredits).toFixed(2);

      const resultBox = document.getElementById('resultBox');
      const scoreDisplay = document.getElementById('sgpaScore');
      const detailsDisplay = document.getElementById('sgpaDetails');

      scoreDisplay.innerText = "SGPA: " + sgpa;
      detailsDisplay.innerText = `Total Earned Credits: ${totalCredits} | Earned Points: ${totalPoints}`;
      resultBox.style.display = 'block';
    }

    // Initialize default rows on load
    initRows();
  </script>
</body>
</html>
