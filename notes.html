<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes & PYQs - AKTU Helper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">AKTU Helper</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="notes.html" class="active">Notes & PYQs</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="add-notes-section">
      <h2 style="text-align: center;">Add New Subject Notes</h2>
      <form id="addNotesForm">
        <div class="input-group">
          <label for="subjectName">Subject Name</label>
          <input type="text" id="subjectName" placeholder="e.g., Data Structures, Engineering Physics" required />
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="subjectBranch">Branch</label>
            <select id="subjectBranch" required>
              <option value="CSE">CSE / IT</option>
              <option value="ECE">ECE</option>
              <option value="EEE">EEE / EE</option>
              <option value="ME">Mechanical (ME)</option>
              <option value="CE">Civil (CE)</option>
              <option value="ALLIED">1st Year / Allied</option>
            </select>
          </div>

          <div class="input-group">
            <label for="subjectSem">Semester</label>
            <select id="subjectSem" required>
              <option value="Sem 1">Sem 1</option>
              <option value="Sem 2">Sem 2</option>
              <option value="Sem 3">Sem 3</option>
              <option value="Sem 4">Sem 4</option>
              <option value="Sem 5">Sem 5</option>
              <option value="Sem 6">Sem 6</option>
              <option value="Sem 7">Sem 7</option>
              <option value="Sem 8">Sem 8</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="driveLink">Google Drive Link</label>
          <input type="url" id="driveLink" placeholder="https://drive.google.com/..." required />
        </div>

        <button type="submit" class="btn-submit">Add Subject Card</button>
      </form>
    </section>

    <section class="filter-section">
      <h3>Filter Notes</h3>
      <div class="filter-container">
        <input type="text" id="searchInput" placeholder="Search by subject name..." />
        
        <select id="filterBranch">
          <option value="ALL">All Branches</option>
          <option value="CSE">CSE / IT</option>
          <option value="ECE">ECE</option>
          <option value="EEE">EEE / EE</option>
          <option value="ME">Mechanical (ME)</option>
          <option value="CE">Civil (CE)</option>
          <option value="ALLIED">1st Year / Allied</option>
        </select>

        <select id="filterSem">
          <option value="ALL">All Semesters</option>
          <option value="Sem 1">Sem 1</option>
          <option value="Sem 2">Sem 2</option>
          <option value="Sem 3">Sem 3</option>
          <option value="Sem 4">Sem 4</option>
          <option value="Sem 5">Sem 5</option>
          <option value="Sem 6">Sem 6</option>
          <option value="Sem 7">Sem 7</option>
          <option value="Sem 8">Sem 8</option>
        </select>
      </div>
    </section>

    <section class="notes-grid-section">
      <div id="notesContainer" class="notes-grid">
        <div class="card" data-branch="ALLIED" data-sem="Sem 1">
          <div>
            <div class="badge-container">
              <span class="badge badge-branch">ALLIED</span>
              <span class="badge badge-sem">Sem 1</span>
            </div>
            <h3>Engineering Physics</h3>
            <p style="font-size: 0.85rem; color: #888;">Google Drive Resource</p>
          </div>
          <a href="#" target="_blank" class="btn-view">View Notes</a>
        </div>
      </div>
    </section>
  </main>

  <button id="ai-chat-toggle" class="ai-chat-toggle">⚡ AKTU AI</button>

  <div id="ai-chat-window" class="ai-chat-window ai-hidden">
    <div class="ai-chat-header">
      <span>AKTU AI Tutor</span>
      <button id="ai-chat-close">&times;</button>
    </div>
    <div id="ai-chat-messages" class="ai-chat-messages">
      <div class="ai-msg bot-msg">Hey! I'm your AKTU study assistant. Ask me anything about your syllabus or exam topics!</div>
    </div>
    <div class="ai-chat-input-area">
      <input type="text" id="ai-chat-input" placeholder="Ask a question..." />
      <button id="ai-chat-send">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
